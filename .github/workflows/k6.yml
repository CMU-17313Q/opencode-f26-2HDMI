name: k6 Load Test

on:
  workflow_run:
    workflows:
      - VM Deploy OpenCode
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6:
    name: load-test
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run k6 on the VM
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_ADMIN }}
          password: ${{ secrets.ADMIN_PASSWORD }}
          script: |
            set -e
            cd ~/${{ secrets.REPO_NAME }}
            git fetch origin main
            git checkout main
            git pull origin main
            for i in $(seq 1 24); do
              if curl -fsS --max-time 10 http://127.0.0.1:4096/ >/dev/null; then
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "site did not become ready on 127.0.0.1:4096"
                exit 1
              fi
              sleep 5
            done
            docker run --rm --network host \
              -v "$PWD/load/k6/load-test.js:/script.js:ro" \
              -e SITE_URL=http://127.0.0.1:4096 \
              grafana/k6:0.54.0 run /script.js
