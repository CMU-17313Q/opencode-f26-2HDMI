name: VM Deploy OpenCode

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.1
        env:
          # Shared course OpenRouter key so other teams can use the deployed instance without their own key.
          # docker compose reads these from the remote shell; they are never written to the repo or image.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_ADMIN }}
          password: ${{ secrets.ADMIN_PASSWORD }}
          envs: OPENROUTER_API_KEY,OPENCODE_MODEL
          script: |
            cd ~/${{ secrets.REPO_NAME }}
            git fetch origin main
            git checkout main
            git pull origin main
            docker compose down
            docker compose up -d --build
