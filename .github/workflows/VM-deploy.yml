name: VM Deploy OpenCode

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.1
        env:
          # Shared course OpenRouter key so other teams can use the deployed instance without their own key.
          # docker compose reads these from the remote shell; they are never written to the repo or image.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_ADMIN }}
          password: ${{ secrets.ADMIN_PASSWORD }}
          envs: OPENROUTER_API_KEY,OPENCODE_MODEL
          command_timeout: 20m
          script: |
            set -e
            cd ~/${{ secrets.REPO_NAME }}
            git fetch origin main
            git checkout main
            git pull origin main
            docker compose up -d --build
            for i in $(seq 1 24); do
              if curl -fsS --max-time 10 http://127.0.0.1:4096/ >/dev/null; then
                exit 0
              fi
              sleep 5
            done
            echo "site did not become ready on 127.0.0.1:4096"
            docker compose logs --tail 80
            exit 1
