name: retire.js

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Scan dependencies for known vulnerabilities
        # Fails only on high/critical findings; lower ones are reported in the log
        run: npx --yes retire@6.1.0 --path . --severity high
